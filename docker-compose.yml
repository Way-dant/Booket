version: "3.8"

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    image: 7666016473/movie-backend:v1
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/movieBooking
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    image: 7666016473/movie-frontend:v1
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: